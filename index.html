<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11130f" />
    <title>Rep Routine</title>
    <link rel="stylesheet" href="styles.css?v=20260902-3" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Weekly training</p>
          <h1>Rep Routine</h1>
        </div>
        <div class="header-actions">
          <button class="compact-button" id="importButton" type="button">Import</button>
          <button class="compact-button" id="exportButton" type="button">Export</button>
          <button class="icon-button" id="historyButton" type="button" aria-label="Open workout history" title="Workout history">☰</button>
          <input class="sr-only" id="importFile" type="file" accept="application/json,.json" />
        </div>
      </header>

      <nav class="day-tabs" id="dayTabs" aria-label="Workout days"></nav>

      <main>
        <section class="workout-heading">
          <div>
            <p class="eyebrow"><span id="dayLabel"></span> · <time id="dateLabel"></time></p>
            <h2 id="workoutTitle">Pull day</h2>
          </div>
          <div class="exercise-count" id="exerciseCount">0 exercises</div>
        </section>

        <section class="exercise-list" id="exerciseList" aria-live="polite"></section>

        <button class="add-exercise-button" id="showExerciseFormButton" type="button">
          <span aria-hidden="true">＋</span> Add exercise
        </button>

        <form class="add-exercise-form hidden" id="exerciseForm">
          <div class="library-picker hidden" id="libraryPicker">
            <label for="librarySearch">Add from your library</label>
            <input id="librarySearch" type="search" placeholder="Search exercises" autocomplete="off" />
            <div class="library-options" id="libraryOptions"></div>
            <div class="form-divider"><span>or create a new exercise</span></div>
          </div>
          <label for="exerciseName">New exercise name</label>
          <div class="form-row">
            <input id="exerciseName" name="exerciseName" type="text" maxlength="50" placeholder="e.g. Lat pulldown" autocomplete="off" required />
            <button class="primary-button" type="submit">Add</button>
          </div>
          <button class="text-button" id="cancelExerciseButton" type="button">Cancel</button>
        </form>
      </main>
    </div>

    <div class="drawer-backdrop hidden" id="drawerBackdrop"></div>
    <aside class="history-drawer" id="historyDrawer" aria-label="Workout history" aria-hidden="true">
      <header class="drawer-header">
        <div>
          <p class="eyebrow">Your training log</p>
          <h2>History</h2>
        </div>
        <button class="icon-button" id="closeHistoryButton" type="button" aria-label="Close workout history">×</button>
      </header>
      <div class="history-list" id="historyList"></div>
      <button class="danger-button" id="resetWeekButton" type="button">Clear all workout data</button>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog class="tag-dialog" id="tagDialog">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Exercise labels</p>
          <h2>Manage tags</h2>
        </div>
        <button class="icon-button" id="closeTagDialogButton" type="button" aria-label="Close tag manager">×</button>
      </div>
      <div class="tag-manager-group">
        <h3>Exercise type</h3>
        <div class="managed-tags" id="typeTagList"></div>
        <form class="tag-form" data-group="type">
          <input type="text" maxlength="20" placeholder="New type tag" aria-label="New exercise type tag" required />
          <button class="primary-button" type="submit">Add</button>
        </form>
      </div>
      <div class="tag-manager-group">
        <h3>Difficulty</h3>
        <div class="managed-tags" id="difficultyTagList"></div>
        <form class="tag-form" data-group="difficulty">
          <input type="text" maxlength="20" placeholder="New difficulty tag" aria-label="New difficulty tag" required />
          <button class="primary-button" type="submit">Add</button>
        </form>
      </div>
      <p class="dialog-hint">Built-in tags stay available. Custom tags can be removed.</p>
    </dialog>

    <aside class="timer-panel" id="timerPanel" aria-label="Rest timer">
      <div class="timer-copy">
        <p class="eyebrow">Rest timer</p>
        <p class="timer-display" id="timerDisplay" aria-live="polite">01:00</p>
      </div>
      <div class="timer-controls">
        <button class="timer-preset active" type="button" data-seconds="60">1 min</button>
        <button class="timer-preset" type="button" data-seconds="120">2 min</button>
        <button class="timer-preset" id="customTimerButton" type="button">Custom</button>
        <button class="timer-toggle" id="timerToggle" type="button">Start</button>
      </div>
      <form class="custom-timer-form hidden" id="customTimerForm">
        <label for="customSeconds">Custom rest in seconds</label>
        <div class="form-row">
          <input id="customSeconds" type="number" min="1" max="3600" inputmode="numeric" placeholder="90" required />
          <button class="primary-button" type="submit">Set</button>
        </div>
      </form>
    </aside>

    <template id="exerciseTemplate">
      <article class="exercise-card">
        <header class="exercise-header">
          <div class="exercise-title-wrap">
            <span class="exercise-number"></span>
            <h3 class="exercise-name"></h3>
          </div>
          <button class="remove-exercise icon-button" type="button" aria-label="Remove exercise">×</button>
        </header>
        <div class="exercise-meta">
          <div class="tag-pills"></div>
          <button class="details-toggle" type="button" aria-expanded="false">Details</button>
        </div>
        <p class="note-preview hidden"></p>
        <div class="set-headings" aria-hidden="true">
          <span>Set</span><span>Weight (kg)</span><span>Reps</span><span></span>
        </div>
        <div class="sets-list"></div>
        <button class="add-set-button" type="button">＋ Add set</button>
        <section class="exercise-details hidden">
          <div class="detail-grid">
            <label>Exercise type<select class="type-select"></select></label>
            <label>Difficulty today<select class="difficulty-select"></select></label>
          </div>
          <button class="manage-tags-button" type="button">Manage tags</button>
          <label class="notes-label">Exercise note<textarea class="note-input" maxlength="500" rows="3" placeholder="Seat position, grip, form cue…"></textarea></label>
          <div class="variations-section">
            <div class="variation-heading">
              <div><h4>Variations</h4><p class="program-week"></p></div>
              <button class="variation-toggle" type="button">＋ Add</button>
            </div>
            <div class="variation-list"></div>
            <form class="variation-form hidden">
              <input class="variation-name" type="text" maxlength="50" placeholder="e.g. Barbell chest press" aria-label="Variation name" required />
              <label>Starting week<input class="variation-week" type="number" min="1" max="520" inputmode="numeric" required /></label>
              <button class="primary-button" type="submit">Schedule</button>
            </form>
          </div>
        </section>
      </article>
    </template>

    <template id="setTemplate">
      <div class="set-row">
        <span class="set-number"></span>
        <label><span class="sr-only">Weight in kilograms</span><input class="weight-input" type="number" min="0" step="0.5" inputmode="decimal" placeholder="0" /></label>
        <label><span class="sr-only">Repetitions</span><input class="reps-input" type="number" min="0" step="1" inputmode="numeric" placeholder="0" /></label>
        <button class="remove-set" type="button" aria-label="Remove set">×</button>
      </div>
    </template>

    <script src="app.js?v=20260902-3"></script>
  </body>
</html>
